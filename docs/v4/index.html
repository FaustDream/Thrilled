<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thrilled · 新标签页原型 v4</title>
<style>
/* ============ 1. 基础令牌（皮肤令牌由 JS 的 SKINS 注入 #stage） ============ */
:root{
  --cell:60px; --inset:25px; --radius-lg:16px; --radius-md:12px;
  --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-lg:14px;
  --z-pop:30; --z-float:40; --z-modal:50; --z-dropdown:55; --z-drawer:60; --z-toast:99;
  --ease:cubic-bezier(.22,.61,.36,1);
  --wp-blur:0px; --wp-mask:0; --dock-icon:66px; --mask-color:#060a10;
  --g-alpha:1; --panel-sub:#6b7280;
  /* 玻璃质感（分功能）：--ga-* 背景 alpha、--blur-* 背景模糊，由 applySkin 按 state.glass 写入 */
  --ga-card:.67; --blur-card:15.6px; --ga-tile:.81; --blur-tile:9.1px;
  --ga-dock:.61; --blur-dock:18.2px; --ga-search:.75; --blur-search:11.7px;
  --ga-panel:.64; --blur-panel:16.9px; --ga-menu:.64; --blur-menu:16.9px;
  --search-radius:25px; --search-width:880px;
}
*{box-sizing:border-box}
#stage svg{display:block;max-width:100%;max-height:100%}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#10151b;
  font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none}
#stage{position:absolute;left:0;top:0;width:1920px;height:945px;transform-origin:top left;overflow:hidden;
  background:transparent;color:var(--panel-text)}
/* 壁纸层：底色渐变 + 极细斜纹。斜纹是「玻璃质感」的参照物——没有可被模糊的细节，毛玻璃就看不出来 */
#stage::before{content:'';position:absolute;inset:-40px;
  background-image:var(--wallpaper),repeating-linear-gradient(135deg,rgba(122,136,160,.075) 0 1px,transparent 1px 8px);
  background-size:cover,auto;filter:blur(var(--wp-blur))}
#stage::after{content:'';position:absolute;inset:0;background:var(--mask-color);opacity:var(--wp-mask);
  pointer-events:none;z-index:1}

/* ============ 2. 搜索栏（y=100 h=50） ============ */
.search-row{position:absolute;left:0;top:100px;width:1920px;height:50px;display:flex;
  justify-content:center;align-items:flex-start;z-index:var(--z-pop)}
.search-box{width:var(--search-width);height:54px;border-radius:var(--search-radius);
  border:2px solid rgba(255,255,255,.72);
  background:rgba(255,255,255,calc(var(--g-alpha) * var(--ga-search)));
  backdrop-filter:blur(var(--blur-search));
  box-shadow:0 8px 24px rgba(6,12,24,.14);
  display:flex;align-items:center;gap:10px;padding:0 18px;transition:border-radius .18s,background .18s,width .18s}
.search-box.line{border-radius:12px;background:transparent;border-color:rgba(255,255,255,.6)}
.engine-ico{width:20px;height:20px;flex:0 0 auto;border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;color:#fff;cursor:pointer;background:#2932e1}
.search-box input{flex:1;height:100%;border:none;background:transparent;outline:none;
  font-size:15px;color:var(--search-text);font-family:inherit}
.search-box input::placeholder{color:var(--search-ph)}
.search-go-btn{width:30px;height:30px;flex:0 0 auto;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:var(--search-text);cursor:pointer;transition:background .16s}
.search-go-btn:hover{background:rgba(255,255,255,.25)}
.search-go-btn svg{width:16px;height:16px}
.search-panel{position:absolute;left:50%;top:160px;transform:translateX(-50%);width:772px;
  background:color-mix(in srgb,#fff calc(var(--g-alpha) * var(--ga-panel) * 100%),transparent);
  backdrop-filter:blur(var(--blur-panel));
  border-radius:12px;box-shadow:0 18px 48px rgba(8,15,30,.24);padding:6px 0;display:none;z-index:var(--z-pop)}
.search-panel.show{display:block}
.sp-head{font-size:13px;font-weight:700;color:#111827;padding:8px 16px 4px}
.sp-row{display:flex;align-items:center;gap:10px;height:40px;padding:0 16px;font-size:14px;
  color:#1f2937;cursor:pointer;white-space:nowrap;overflow:hidden}
.sp-row:hover{background:#f4f6fa}
.sp-row span.t{flex:1;overflow:hidden;text-overflow:ellipsis}

/* 搜索引擎下拉（点击搜索框左侧引擎图标展开；与搜索历史面板互斥） */
.engine-panel{position:absolute;top:160px;width:242px;max-height:642px;overflow:auto;padding:6px;
  background:color-mix(in srgb,var(--menu-bg) calc(var(--g-alpha) * var(--ga-menu) * 100%),transparent);
  backdrop-filter:blur(var(--blur-menu));border-radius:12px;box-shadow:0 18px 48px rgba(8,15,30,.24);
  display:none;z-index:var(--z-dropdown);color:var(--panel-text)}
.engine-panel.show{display:block}
.ep-row{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;
  font-size:13px;color:var(--panel-text);cursor:pointer;white-space:nowrap;overflow:hidden}
.ep-row:hover{background:var(--menu-hover)}
.ep-row.on{color:var(--accent);font-weight:600}
.ep-ico{width:18px;height:18px;flex:0 0 auto;border-radius:5px;color:#fff;font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.ep-n{flex:1;overflow:hidden;text-overflow:ellipsis}
.ep-key{flex:0 0 auto;font-size:11px;line-height:16px;padding:0 5px;border-radius:4px;
  border:1px solid var(--line);color:var(--panel-sub)}
.ep-cur{flex:0 0 auto;color:var(--accent)}
.ep-cur svg{width:15px;height:15px}
.ep-foot{height:1px;background:var(--line);margin:6px 4px}
.ep-manage{color:var(--panel-sub)}
.ep-manage svg{width:15px;height:15px;flex:0 0 auto}

/* ============ 3. 翻页画布与网格 ============ */
#pager{position:absolute;left:0;top:0;height:100%;z-index:2;transition:transform .42s var(--ease)}
.page{position:absolute;top:0;width:1920px;height:100%}
.grid{position:absolute;left:240px;top:50%;width:1440px;height:600px;margin-top:-300px}
.item{position:absolute;border-radius:var(--radius-lg);overflow:hidden;
  background:color-mix(in srgb,var(--card-bg) calc(var(--g-alpha) * var(--ga-card) * 100%),transparent);
  backdrop-filter:blur(var(--blur-card));
  cursor:pointer;transition:transform .14s var(--ease)}
.item:hover{transform:translateY(-2px)}
.item-label{position:absolute;height:20px;line-height:20px;font-size:14px;color:var(--label-color);
  text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.4);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;pointer-events:none}
#stage[data-labels='0'] .item-label{display:none}
#stage[data-hidetop='1'] .mode-pill,#stage[data-hidetop='1'] .avatar{display:none}
#stage[data-hidesearch='1'] .search-row{display:none}
#stage[data-showtime='0'] .ck-time{display:none}
#stage[data-showdate='0'] .ck-date{display:none}
#stage[data-showquote='0'] .item[data-t='quote']{display:none}
#stage[data-mode='minimal'] #pager{display:none}
#stage[data-mode='minimal'] .minimal-clock{display:block}
#stage[data-mode='minimal'] .search-box{border-radius:12px;background:transparent}

/* ============ 4. 图标瓦片（统一容器：白底 + 品牌色字形） ============ */
/* 统一图标容器（规范）：品牌色字形 + 统一圆角 + 统一细边框与投影 + 玻璃质感（分功能可调）。
   网格图标、图标格容器、Dock 应用与 Dock 功能按钮全部共用这一套，不出现第二种图标语言。 */
.v-icon,.gi,.nv-ico,.dock-icon,.gtile{display:flex;align-items:center;justify-content:center;
  font-weight:800;letter-spacing:-.5px;
  background:color-mix(in srgb,#fff calc(var(--g-alpha) * var(--ga-tile) * 100%),transparent);
  backdrop-filter:blur(var(--blur-tile));
  border:1px solid rgba(255,255,255,.55);box-shadow:0 2px 8px rgba(6,12,24,.12)}
.v-icon{font-size:24px;border-radius:14px}
.v-icon.lat{font-size:17px}
.gcell{display:flex;align-items:center;justify-content:center}
.gi{border-radius:14px}
.w-group{padding:15px}

/* ============ 5. 小组件 ============ */
/* 新闻热点 */
.w-news{display:flex;flex-direction:column}
.news-head{height:40px;flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 10px 0 14px;
  overflow:hidden;background:linear-gradient(90deg,#ff7a45,#ff4d4f);color:#fff}
.news-tab{font-size:12px;opacity:.82;cursor:pointer;white-space:nowrap}
.news-tab.active{opacity:1;font-weight:700}
.news-more{margin-left:auto;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-size:13px;cursor:pointer;background:rgba(255,255,255,.22)}
.news-list{flex:1;padding:4px 10px 6px;display:flex;flex-direction:column;justify-content:space-between}
.news-row{display:flex;align-items:center;gap:8px;height:32px;border-radius:8px;padding:0 6px}
.news-row.top{background:rgba(255,122,69,.12)}
.news-idx{width:12px;flex:0 0 auto;font-size:13px;font-weight:700;color:#ff7a45;font-style:italic}
.news-title{flex:1;font-size:13px;color:var(--card-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.news-heat{flex:0 0 auto;font-size:12px;font-weight:700;color:#ff7a45}

/* 音乐（熊猫Dj） */
.w-music{background:var(--mascot-grad);display:flex;flex-direction:column;align-items:center;
  justify-content:center;position:relative;color:#fff}
.mu-list{position:absolute;right:12px;top:12px;width:22px;height:22px;color:rgba(255,255,255,.9);cursor:pointer}
.mu-disc{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(from 210deg,#2b2140,#e05a8a,#8b5cf6,#f0a6c8,#2b2140);
  box-shadow:0 10px 26px rgba(45,20,60,.35)}
.mu-disc i{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.86);display:block}
.mu-ctl{display:flex;align-items:center;gap:12px;margin-top:14px}
.mu-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);color:#8b5cf6;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.mu-btn.play{width:40px;height:40px;color:#7c3aed}
.mu-btn svg{width:16px;height:16px}
.mu-btn.play svg{width:19px;height:19px}

/* UiTab AI 类入口 */
.w-ai{background:linear-gradient(160deg,#0b1220,#111c31);display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:#e8eefc}
.ai-logo{font-size:54px;font-weight:800;line-height:1;letter-spacing:2px;
  background:linear-gradient(180deg,#a7e8ff,#3b82f6);-webkit-background-clip:text;background-clip:text;
  color:transparent;filter:drop-shadow(0 0 14px rgba(56,189,248,.6))}
.ai-line{width:104px;height:1px;background:rgba(255,255,255,.26);margin:12px 0 10px}
.ai-name{font-size:15px;font-weight:600}
.ai-sub{font-size:11px;color:#93a4bf;margin-top:4px}

/* 天气 */
.w-weather{display:flex;align-items:center;padding:0 14px;color:var(--card-text)}
.wx-temp{font-size:24px;font-weight:700;flex:0 0 auto}
.wx-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;margin-left:8px}
.wx-city{font-size:13px}
.wx-desc{font-size:12px;color:var(--card-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wx-ico{width:26px;height:24px;flex:0 0 auto;color:#7db8f0}

/* 时钟 */
.w-clock{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--card-text)}
.ck-time{font-size:44px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--clock-color)}
.ck-date{font-size:14px;color:var(--card-sub)}
.w-clock .ck-time.lg{font-size:52px}

/* 收藏夹 */
.w-fav{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--card-text)}
.w-fav svg{width:26px;height:26px;color:var(--accent)}
.fav-text{writing-mode:vertical-rl;font-size:13px;color:var(--card-sub);letter-spacing:3px}

/* 待办 */
.w-todo{position:relative;color:#38A29E}
.w-todo .td-ico{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:26px;height:26px}
.w-todo .td-txt{position:absolute;right:45px;top:50%;transform:translateY(-50%);font-size:20px;font-weight:600}

/* 日历 */
.w-cal{display:flex;color:var(--card-text)}
.cal-bar{width:55px;flex:0 0 auto;background:linear-gradient(180deg,#8DD8FF,#4492FF);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cal-day{font-size:28px;font-weight:700;line-height:1}
.cal-wd{font-size:14px}
.cal-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding-left:16px}
.cal-month{font-size:14px;font-weight:600}
.cal-lunar{font-size:13px;color:var(--card-sub)}

/* 下班倒计时 */
.w-cd{padding:14px 18px;display:flex;color:var(--card-text)}
.cd-l{flex:1;min-width:0;display:flex;flex-direction:column}
.cd-hint{font-size:13px;color:var(--card-sub)}
.cd-time{font-size:38px;font-weight:700;line-height:1.15;letter-spacing:2px;font-variant-numeric:tabular-nums}
.cd-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px 14px;margin-top:6px}
.cd-entry{display:flex;align-items:center;gap:6px}
.cd-label{font-size:12px;color:var(--card-sub)}
.cd-val{font-size:16px;font-weight:600}
.cd-val.money{color:var(--accent)}
.cd-mascot{width:132px;flex:0 0 auto;align-self:center}

/* 纪念日 */
.w-ann{padding:20px 24px;display:flex;align-items:center;justify-content:space-between;color:var(--card-text)}
.ann-l{min-width:0;display:flex;flex-direction:column;gap:10px}
.ann-title{font-size:18px;font-weight:600}
.ann-date{font-size:13px;color:var(--card-sub)}
.ann-r{flex:0 0 auto;display:flex;align-items:baseline;gap:6px}
.ann-num{font-size:54px;font-weight:700;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.ann-unit{font-size:14px;color:var(--card-sub)}

/* 图标文件夹 */
.w-folder{display:flex;align-items:center;justify-content:center;color:var(--card-sub)}
.w-folder svg{width:34px;height:34px}

/* ============ 6. Dock（悬浮圆角栏 + 分隔线 + 4 功能按钮） ============ */
.dock{position:absolute;left:0;bottom:0;width:1920px;height:122px;display:flex;align-items:center;
  justify-content:center;z-index:var(--z-float)}
.dock-bar{display:flex;align-items:center;padding:14px 10px;border-radius:24px;
  background:rgba(255,255,255,calc(var(--g-alpha) * var(--ga-dock)));backdrop-filter:blur(var(--blur-dock));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 12px 34px rgba(6,12,24,.24)}
#stage[data-mode='minimal'] .dock-bar{background:rgba(255,255,255,calc(var(--g-alpha) * (var(--ga-dock) + .12)))}
.dock-apps,.dock-actions{display:flex}
.dock-sep{width:1px;height:52px;margin:0 22px;background:var(--label-color);opacity:.28;flex:0 0 auto}
.dock-item{width:98px;height:98px;display:flex;align-items:center;justify-content:center;
  position:relative;cursor:pointer}
.dock-icon{width:var(--dock-icon);height:var(--dock-icon);border-radius:20px;font-size:26px;flex:0 0 auto;
  box-shadow:0 4px 12px rgba(6,12,24,.14);
  transition:transform .16s var(--ease)}
.dock-icon.circle{border-radius:50%}
.dock-icon svg{width:32px;height:32px}
.dock-item:hover .dock-icon{transform:scale(1.22)}
.dock-name{position:absolute;top:4px;left:50%;transform:translate(-50%,-100%) scale(.92);
  background:rgba(15,23,42,.86);color:#fff;font-size:12px;padding:4px 10px;border-radius:8px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s}
.dock-item:hover .dock-name{opacity:1;transform:translate(-50%,-100%) scale(1)}

/* ============ 7. 模式胶囊 / 头像 ============ */
.mode-pill{position:absolute;left:40px;top:16px;height:50px;border-radius:12px;display:flex;
  align-items:center;gap:6px;padding:0 10px;color:var(--chip-text);
  background:color-mix(in srgb,var(--chip-bg) calc(var(--g-alpha) * var(--ga-menu) * 100%),transparent);
  backdrop-filter:blur(var(--blur-menu));z-index:var(--z-dropdown);cursor:pointer;overflow:hidden}
.pill-ico{width:22px;height:22px;flex:0 0 auto}
.pill-opts{display:flex;gap:6px;opacity:0;max-width:0;transition:opacity .18s,max-width .18s}
.mode-pill:hover .pill-opts,.mode-pill.open .pill-opts{opacity:1;max-width:420px}
.pill-btn{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;font-size:14px;
  white-space:nowrap;color:var(--chip-text)}
.pill-btn svg{width:15px;height:15px}
.pill-btn.active{background:rgba(255,255,255,.92);color:#1f2937;font-weight:600}
.mode-tip{position:absolute;left:392px;top:22px;padding:7px 12px;border-radius:9px;font-size:12px;
  background:color-mix(in srgb,var(--menu-bg) calc(var(--g-alpha) * var(--ga-menu) * 100%),transparent);color:var(--menu-text);
  box-shadow:0 10px 26px rgba(6,12,24,.26);
  opacity:0;pointer-events:none;transition:opacity .16s;z-index:var(--z-dropdown);max-width:340px;line-height:1.5}
.mode-tip.show{opacity:1}
.avatar{position:absolute;right:56px;top:16px;width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;
  cursor:pointer;background-image:linear-gradient(160deg,#f5c58a,#e08a4a);z-index:var(--z-dropdown);
  box-shadow:0 6px 18px rgba(15,23,42,.28)}

/* ============ 8. 极简模式大时钟 ============ */
.minimal-clock{position:absolute;left:50%;top:250px;transform:translateX(-50%);text-align:center;
  color:#fff;display:none;text-shadow:0 2px 14px rgba(0,0,0,.42);z-index:2}
.mc-time{font-size:78px;font-weight:700;letter-spacing:3px;font-variant-numeric:tabular-nums}
.mc-date{font-size:16px;opacity:.92;margin-top:6px}

/* ============ 9. 右键菜单 ============ */
.ctx{position:absolute;width:196px;color:var(--menu-text);border-radius:10px;
  background:color-mix(in srgb,var(--menu-bg) calc(var(--g-alpha) * var(--ga-menu) * 100%),transparent);
  backdrop-filter:blur(var(--blur-menu));
  padding:6px 0;box-shadow:0 16px 44px rgba(6,12,24,.3);z-index:var(--z-dropdown);display:none}
.ctx.show{display:block}
.ctx-item{height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:0 14px;font-size:14px;cursor:pointer;position:relative}
.ctx-item:hover{background:var(--menu-hover)}
.ctx-arrow{width:0;height:0;border-left:5px solid var(--panel-sub);border-top:4px solid transparent;
  border-bottom:4px solid transparent;opacity:.7}
.ctx-switch{width:34px;height:18px;border-radius:9px;background:rgba(148,163,184,.55);position:relative;
  flex:0 0 auto;transition:background .18s}
.ctx-switch i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;
  transition:left .18s}
.ctx-switch.on{background:var(--accent)}
.ctx-switch.on i{left:18px}
.ctx-sub{position:absolute;left:100%;top:-6px;margin-left:2px;width:186px;border-radius:10px;padding:6px 0;
  background:color-mix(in srgb,var(--menu-bg) calc(var(--g-alpha) * var(--ga-menu) * 100%),transparent);
  backdrop-filter:blur(var(--blur-menu));
  box-shadow:0 16px 44px rgba(6,12,24,.3);display:none}
.ctx-item:hover>.ctx-sub{display:block}
.ctx.flip .ctx-sub{left:auto;right:100%;margin-left:0;margin-right:2px}
.ctx-sub-item{height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:13px;cursor:pointer}
.ctx-sub-item:hover{background:var(--menu-hover)}
.ctx-check{width:14px;height:14px;flex:0 0 auto;color:var(--accent);visibility:hidden}
.ctx-sub-item.on .ctx-check{visibility:visible}

/* ============ 10. 抽屉 ============ */
.dw-mask{position:absolute;inset:0;background:rgba(8,12,20,.34);z-index:calc(var(--z-drawer) - 1);
  opacity:0;pointer-events:none;transition:opacity .24s var(--ease)}
.dw-mask.show{opacity:1;pointer-events:auto}
.dw{position:absolute;top:0;right:0;height:100%;width:392px;color:var(--panel-text);

.dw-sub{font-size:12px;color:var(--panel-sub);margin-top:2px}

/* ============ 11. 表单与通用控件 ============ */
.f-row{margin-bottom:14px}

.btn{height:38px;padding:0 16px;border-radius:10px;border:none;background:var(--accent);color:#fff;
  font-size:13px;cursor:pointer;font-family:inherit}

.sl-head{display:flex;justify-content:space-between;font-size:12px;color:var(--panel-sub);margin-bottom:8px}

/* 网址导航 / 广场 */

.pz-body{padding:8px 10px;flex:1;display:flex;flex-direction:column;gap:4px}
.pz-title{font-size:13px;font-weight:600}
.pz-sub{font-size:11px;color:var(--panel-sub)}
.pz-like{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--panel-sub);cursor:pointer}

.pz-acts{display:flex;gap:6px;margin-top:4px}
.pager-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;font-size:12px;
  color:var(--panel-sub)}

  justify-content:center;cursor:pointer;background:var(--line)}

.wall-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.tb-tag{font-size:10px;line-height:14px;padding:0 5px;border-radius:4px;background:var(--menu-hover);
  color:var(--panel-sub)}
.tb-desc{font-size:11px;color:var(--panel-sub);margin-top:4px}
.color-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:12px}
.color-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--panel-sub)}
.color-row input[type='color']{width:44px;height:26px;padding:0;border:1px solid var(--line);
  border-radius:6px;background:none;cursor:pointer}
.wp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.wp-view{overflow:hidden;border-radius:14px}
.wp-inner{display:flex;transition:transform .3s var(--ease)}
.wp-page{min-width:100%;display:flex;gap:10px}
.wp-card{flex:1;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}
.wp-card:hover{border-color:var(--accent)}
.wp-prev{height:76px;display:flex;align-items:center;justify-content:center;
  color:var(--card-text);font-size:18px;font-weight:700}
.wp-meta{padding:8px 10px;font-size:11px;color:var(--panel-sub)}
.wp-meta b{display:block;font-size:13px;color:var(--panel-text);margin-bottom:2px;font-weight:600}

/* ============ 12. 弹窗与 Toast ============ */
.modal-mask{position:absolute;inset:0;background:rgba(6,10,18,.52);z-index:var(--z-modal);display:none;
  align-items:center;justify-content:center}
.modal-mask.show{display:flex}
.modal{width:780px;max-height:660px;overflow-y:auto;border-radius:20px;padding:30px 34px;
  background:color-mix(in srgb,#fff calc(var(--g-alpha) * var(--ga-panel) * 100%),transparent);
  backdrop-filter:blur(var(--blur-panel));
  color:#1f2937;box-shadow:0 24px 70px rgba(6,10,18,.4)}
.modal.narrow{width:520px}
.modal h2{margin:0 0 10px;font-size:24px}
.modal p.sub{margin:0 0 22px;font-size:14px;color:#8b95a6;line-height:1.6}
.th-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.th-card{border:2px solid #e8edf3;border-radius:14px;padding:8px;cursor:pointer}
.th-card.sel{border-color:#3b82f6}
.th-prev{height:94px;border-radius:10px;overflow:hidden;position:relative;margin-bottom:8px}
.th-prev .t-card{position:absolute;border-radius:4px;background:#fff}
.th-prev .t-dock{position:absolute;left:14%;right:14%;bottom:8px;height:10px;border-radius:5px;
  background:rgba(255,255,255,.6)}
.th-name{font-size:13px;text-align:center}
.log-item{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid #eef1f6;font-size:13px;color:#4b5563}
.log-item b{flex:0 0 82px;color:#111827}
.log-item ul{margin:0;padding-left:18px;line-height:1.8}
.toast{position:absolute;left:50%;bottom:160px;transform:translate(-50%,14px);background:rgba(15,23,42,.9);
  color:#fff;font-size:13px;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;
  transition:opacity .2s var(--ease),transform .2s var(--ease);z-index:var(--z-toast);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ 13. 补充小组件（每日一言 / 木鱼 / 倒数日 / 迷你卡） ============ */
:root{--mascot-grad:linear-gradient(150deg,#9294DF,#F1B2D9)}
.news-row{height:auto;flex:1;min-height:0}
.news-list{gap:2px;overflow:hidden}
.w-fav{flex-direction:row;gap:10px}
.w-quote{display:flex;flex-direction:column;justify-content:center;gap:8px;padding:0 24px;color:var(--card-text)}

.qt-enc{display:flex;align-items:center;gap:10px;min-width:0}
.qt-enc-t{border-left:3px solid var(--accent);padding-left:10px;font-size:13px;line-height:1.45;
  color:var(--card-sub);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-quote.reloading .qt-enc-t{animation:qtpulse .4s var(--ease)}
@keyframes qtpulse{0%{opacity:.2;transform:translateX(-6px)}100%{opacity:1;transform:none}}
.w-fish{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  cursor:pointer;color:var(--card-text)}
.fish-ico{width:36px;height:36px;color:#c98a4b;transition:transform .1s}

.fish-num{font-size:13px;font-weight:600}
.w-count{padding:12px 16px;display:flex;flex-direction:column;justify-content:center;gap:5px;color:var(--card-text)}
.ct-top{font-size:13px;color:var(--card-sub)}
.ct-mid{display:flex;align-items:baseline;gap:6px}
.ct-num{font-size:36px;font-weight:700;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.ct-unit{font-size:13px;color:var(--card-sub)}
.w-mini{display:flex;align-items:center;gap:12px;padding:0 18px;color:var(--card-text)}
.w-mini svg{width:28px;height:28px;flex:0 0 auto;color:var(--accent)}
.mini-t{font-size:14px;font-weight:600}
.mini-s{font-size:11px;color:var(--card-sub);margin-top:3px}
.w-todo2{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding-right:45px;color:#38A29E;position:absolute;inset:0}

.td-txt2{font-size:16px;font-weight:600;white-space:nowrap}
.gcell-grid{display:grid;gap:10px;justify-content:center;align-content:center}
.gtile{border-radius:14px;width:100%;height:100%}
.v-cell{display:flex;align-items:center;justify-content:center}

/* ============ 14. 条目悬浮操作 ============ */
.item-acts{position:absolute;right:6px;bottom:6px;display:flex;gap:4px;opacity:0;
  transition:opacity .16s;z-index:3}
.item:hover .item-acts{opacity:1}
.ia{width:22px;height:22px;border-radius:7px;background:rgba(15,23,42,.6);color:#fff;display:flex;
  align-items:center;justify-content:center;cursor:pointer}
.ia:hover{background:rgba(15,23,42,.85)}
.ia svg{width:12px;height:12px}
.item.dragging{opacity:.45}
.page-dots{position:absolute;left:50%;bottom:132px;transform:translateX(-50%);display:flex;gap:8px;
  z-index:var(--z-float)}
.page-dot{width:8px;height:8px;border-radius:50%;background:var(--label-color);opacity:.45;cursor:pointer;
  transition:opacity .18s,transform .18s}
.page-dot.on{opacity:1;transform:scale(1.25)}
#stage[data-mode='minimal'] .page-dots{display:none}
</style>

const tileHTML = (name, cls, fs, sz) => {
  const t = B[name] || ['#64748B', String(name).slice(0, 1)]
  const lat = t[2] === 'lat'
  const fsz = lat ? Math.round(fs * .74) : fs
  return '<div class="' + cls + (lat ? ' lat' : '') + '" style="color:' + t[0] +
    (sz ? ';width:' + sz + 'px;height:' + sz + 'px' : '') + ';font-size:' + fsz + 'px">' + esc(t[1]) + '</div>'
}

const findSlot = (page, w, h) => {
  for (let r = 0; r + h <= ROWS; r++) {
    for (let c = 0; c + w <= COLS; c++) {
      const hit = page.some(it => it.c < c + w && c < it.c + it.w && it.r < r + h && r < it.r + it.h)
      if (!hit) return { c: c, r: r }
    }
  }
  return null
}
const clockTick = () => {
  const d = new Date()
  const wd = '日一二三四五六'[d.getDay()]
  const ds = pad(d.getMonth() + 1) + '月' + pad(d.getDate()) + '日 星期' + wd
  q('#mcTime').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds())
  q('#mcDate').textContent = d.getFullYear() + '年' + ds
  /* 卡片内容按各自实例的 config 渲染：时钟可在编辑面板里打开「显示秒数」 */
  qa('[data-clock="t"]').forEach(e => {
    const it = findItem(e.closest('.item') && e.closest('.item').getAttribute('data-id'))
    const sec = it && C(it).showSeconds
    e.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + (sec ? ':' + pad(d.getSeconds()) : '')
  })
  qa('[data-clock="d"]').forEach(e => e.textContent = ds)
  qa('[data-clock="day"]').forEach(e => e.textContent = pad(d.getDate()))
  qa('[data-clock="wd"]').forEach(e => e.textContent = wd)
  qa('[data-clock="ym"]').forEach(e => e.textContent = d.getFullYear() + '年' + (d.getMonth() + 1) + '月')
  qa('[data-clock="cd"]').forEach(e => {
    const it = findItem(e.closest('.item') && e.closest('.item').getAttribute('data-id'))
    const p = String(it && C(it).at || '18:00').split(':')
    const end = new Date(d.getFullYear(), d.getMonth(), d.getDate(), +p[0] || 18, +p[1] || 0, 0)
    let left = Math.floor((end - d) / 1000)
    if (left < 0) left = 0
    e.textContent = pad(Math.floor(left / 3600)) + ':' + pad(Math.floor(left / 60) % 60) + ':' + pad(left % 60)
  })
}

  return { id: x.id || uid(), c: Math.max(0, Math.min(COLS - x.w, +x.c || 0)),

  'theme-pick': v => { state.selSkin = v; refreshModal() },
  'theme-apply': () => { const s = state.skins.filter(x => x.id === state.selSkin)[0]; state.wall = s.wall || 0; applySkin(s.id); closeModal(); toast('应用成功') },
  'eng-set': v => { state.engine = +v; renderEngine(); hideEnginePanel(); hideCtx(); if (state.modal) refreshModal(); if (state.draw) refreshDrawer(); toast('该搜索引擎正在使用中') },
  'eng-hide': v => {
    const e = ENGINES[+v]
    if (!e) return
    if (!e.hide && engVisible().length <= 1) { toast('至少保留一个可见的搜索引擎'); return }
    e.hide = !e.hide
    if (e.hide && ENGINES[state.engine] === e) state.engine = ENGINES.indexOf(engVisible()[0])
    renderEngine(); renderEnginePanel(); refreshDrawer(); if (state.modal) refreshModal()
    toast((e.hide ? '已隐藏：' : '已显示：') + e.n)
  },
  'eng-up': v => { const i = +v; if (i > 0) { const t = ENGINES[i - 1]; ENGINES[i - 1] = ENGINES[i]; ENGINES[i] = t; if (state.engine === i) state.engine = i - 1; refreshModal(); renderEngine(); renderEnginePanel() } },
  'eng-add': () => { if (engVisible().length >= 12) { toast('展示数量已达上限 12 个，请先隐藏其他引擎'); return }
    const n = state.engName || '自定义'; ENGINES.push({ n: n, c: '#0EA5E9', g: n.slice(0, 1), u: (state.engUrl || '') })
    closeModal(); renderEngine(); renderEnginePanel(); toast('添加成功') },
  'open-mode': v => { state.openMode = v; hideCtx() },
  'ctx-tog': v => { CTX_TOG[v](); syncStage(); renderDock(); hideCtx() },
  'ctx-do': v => { hideCtx()
    const map = { alpha: 'glass', count: 'dockCount', icon: 'dockIcon' }
    if (map[v]) { openDrawer('personal'); return }
    if (v === 'sync') { toast('正在同步数据…'); setTimeout(() => toast('同步完成'), 900); return }
    if (v === 'msg') { toast('暂无消息'); return }
    if (v === 'log') { openModal('log'); return }
    if (v === 'about') { openModal('about'); return } },
  'open-modal': v => { hideCtx(); openModal(v) },
  'close-modal': () => closeModal(),
  'login-tab': v => { state.loginTab = +v; refreshModal() },
  'login-do': () => { state.user = { email: state.loginMail || 'me@thrilled.dev' }; closeModal(); refreshDrawer(); toast('登录成功，已进入隐私模式'); setMode('privacy') },
  'logout': () => { state.user = null; refreshDrawer(); toast('退出成功') },
  'bind-mail': () => toast('请输入旧邮箱 / 请输入新邮箱'),
  'change-pwd': () => toast('请输入旧密码 / 请输入新密码'),
  'sign-name': () => toast('我的个性签名'),
  'del-account': () => toast('注销账号：将彻底删除选中的账号数据'),
  'pf-tab': v => { state.pfTab = +v; refreshDrawer() },
  'pz-tab': v => { state.pzTab = +v; refreshDrawer() },
  'pz-mine': v => { state.pzMine = +v; refreshDrawer() },
  'pz-cat': (v, el) => { qa('.cats .cat', el.parentElement).forEach(c => c.classList.toggle('active', c === el)) },
  'pz-page': v => { state.pzPage = +v; refreshDrawer() },
  'pz-like': v => { state.like[v] = !state.like[v]; refreshDrawer() },
  'pz-apply': () => { closeDrawer(); toast('应用成功，恢复后将覆盖当前界面') },
  'pz-del': () => toast('确定删除作品'),
  'share-do': () => { closeDrawer(); toast('正在分享…'); setTimeout(() => toast('分享成功'), 800) },
  'copy-link': () => toast('复制分享链接查看'),
  'share-pub': () => { state.sharePub = true; refreshDrawer() },
  'share-pri': () => { state.sharePub = false; refreshDrawer() },
  'share-mode': (v, el) => { qa('.cats .cat', el.parentElement).forEach(c => c.classList.toggle('active', c === el)) },
  'backup-do': () => { state.backupTime = new Date().toLocaleString('zh-CN'); closeModal(); toast('备份成功') },
  'cloud-backup': () => toast(state.user ? '云端备份完成' : '请先登录'),
  'restore-do': () => { closeModal(); reseedLayout(); toast('已恢复为默认界面') },
  'clear-local': () => toast('清除本地数据成功'),
  'reset-do': () => { closeModal(); reseedLayout(); toast('已一键重置为出厂布局') },
  'export-layout': () => { exportLayout(); toast('已导出 thrilled-layout.json') },
  'import-layout': () => { const f = q('#importFile'); f.value = ''; f.click() },
  'feedback': () => toast('问题反馈：请联系工作人员'),
  'policy': () => toast('隐私协议：尊重用户的隐私权利'),
  'contact': () => toast('联系作者：请联系工作人员'),
  'to-plugin': () => toast('请转到插件中使用')
}
const openLink = name => {
  toast((state.openMode === 'tab' ? '新标签页打开：' : '当前窗口打开：') + name)
}

/* ===================== 14. 事件 ===================== */
const stage = q('#stage')
document.addEventListener('click', e => {
  const t = e.target.closest && e.target.closest('[data-act]')
  if (t) {
    const host = t.closest('.item')
    if (host) state.itemId = host.getAttribute('data-id')
    const fn = ACTIONS[t.getAttribute('data-act')]
    if (fn) fn(t.getAttribute('data-v') || '', t)
    return
  }
  if (!(e.target.closest && e.target.closest('#ctx'))) hideCtx()
  if (!(e.target.closest && (e.target.closest('#searchBox') || e.target.closest('#searchPanel')))) q('#searchPanel').classList.remove('show')
  if (!(e.target.closest && (e.target.closest('#engineIco') || e.target.closest('#enginePanel')))) hideEnginePanel()
  if (e.target.id === 'modalMask') closeModal()
  if (e.target.classList && e.target.classList.contains('grid')) { q('#searchInput').focus(); renderSearchPanel() }
})
document.addEventListener('contextmenu', e => {
  e.preventDefault()
  const el = e.target.closest && e.target.closest('.item')
  const r = q('#stage').getBoundingClientRect()
  const s = r.width / STAGE_W
  const x = (e.clientX - r.left) / s, y = (e.clientY - r.top) / s
  renderCtx(Math.min(x, STAGE_W - 240), y, el ? el.getAttribute('data-id') : null)
})
document.addEventListener('input', e => {
  const k = e.target.getAttribute && e.target.getAttribute('data-inp')
  if (!k) return
  const v = e.target.value
  if (RANGE[k]) { RANGE[k](+v, e.target); return }
  /* 编辑面板字段：即时写入实例 config（type=num 转数字，type=list 拆成数组） */
  if (k.indexOf('edit:') === 0) {
    const it = findItem(state.itemId)
    if (!it) return
    const key = k.slice(5)
    const d = WIDGET_DEFS[it.t] || WIDGET_DEFS.icon
    const f = d.fields.filter(x => x.k === key)[0]
    it.config[key] = f && f.t === 'list' ? v.split(/[,，]/).map(s => s.trim()).filter(Boolean)
      : (f && f.t === 'num' ? (v === '' ? 0 : +v) : v)
    if (key === 'label' && it.t === 'icon') it.config.name = v
    return
  }
  if (k.indexOf('glass:') === 0) {
    state.glass[k.slice(6)] = +v / 100
    applySkin(state.skinId)
    setHead(e.target, v + '%')
    return
  }
  if (k.indexOf('skin:') === 0) { skinSet(k.slice(5), v); return }
  if (k === 'addKw') { state.addKw = v
    const box = q('#addList'); if (!box) return
    const ws = WIDGET_LIST.filter(w => !v || w.n.indexOf(v) >= 0 || w.s.indexOf(v) >= 0)
    box.innerHTML = ws.length ? ws.map(w => '<div class="eng-row"><div class="er-ico" style="background:' + w.c + '">' + w.g + '</div>' +
      '<div style="flex:1;min-width:0"><div>' + w.n + '</div><div style="color:var(--panel-sub);font-size:11px">' + w.s + '</div></div>' +
      '<button class="btn sm" data-act="add-widget" data-v="' + w.t + '">添加</button></div>').join('') : '<div class="empty-box">暂无结果</div>'
    return }
  if (k === 'nick') { state.nick = v; qa('.qt-hi').forEach(el => el.textContent = greetByHour() + '，' + state.nick); return }
  if (k === 'clockColor') { state.clockColor = v; document.documentElement.style.setProperty('--clock-color', v); return }
  state[k] = v
})
q('#searchInput').addEventListener('focus', () => renderSearchPanel())
/* 编辑字段失焦后刷新网格（输入过程中不重绘，避免丢焦点）；导入布局走隐藏的 file input */
document.addEventListener('change', e => {
  const k = e.target.getAttribute && e.target.getAttribute('data-inp')
  if (k && k.indexOf('edit:') === 0) renderPager()
})
q('#importFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]
  if (!f) return
  const rd = new FileReader()
  rd.onload = () => {
    try {
      const d = JSON.parse(String(rd.result))
      toast(importLayout(d) ? '布局导入成功' : '布局导入失败：standard / privacy 不能为空')
    } catch {
      toast('布局导入失败：不是合法的 JSON 文件')
    }
  }
  rd.readAsText(f)
})
q('#searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); ACTIONS['search-go']() }
})
q('#stage').addEventListener('dblclick', e => {
  const host = e.target.closest && e.target.closest('.item')
  if (host && host.getAttribute('data-t') === 'quote') ACTIONS['quote-refresh']('', host)
})
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { hideCtx(); hideEnginePanel(); closeModal(); closeDrawer(); q('#searchPanel').classList.remove('show'); return }
  const typing = e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return
  if (e.key >= '1' && e.key <= '9') {
    const vis = engVisible(); const i = +e.key - 1
    if (i < vis.length) { state.engine = ENGINES.indexOf(vis[i]); renderEngine(); renderEnginePanel(); toast('已切换到：' + vis[i].n) }
    return
  }
  if (e.key === 'ArrowLeft') goPage(state.cur[state.mode] - 1)
  if (e.key === 'ArrowRight') goPage(state.cur[state.mode] + 1)
})
q('#modePill').addEventListener('mouseenter', () => { q('#modeTip').classList.add('show') })
q('#modePill').addEventListener('mouseleave', () => { q('#modeTip').classList.remove('show') })
let dragRow = null
document.addEventListener('dragstart', e => {
  const row = e.target.closest && e.target.closest('.eng-row.sortable')
  if (!row) return
  dragRow = row
  row.classList.add('drag')
  e.dataTransfer.effectAllowed = 'move'
})
document.addEventListener('dragover', e => {
  if (!dragRow) return
  const row = e.target.closest && e.target.closest('.eng-row.sortable')
  if (!row || row === dragRow) return
  e.preventDefault()
  const box = row.parentElement
  const rows = qa('.eng-row.sortable', box)
  box.insertBefore(dragRow, rows.indexOf(dragRow) < rows.indexOf(row) ? row.nextSibling : row)
})
document.addEventListener('drop', e => { if (dragRow) e.preventDefault() })
document.addEventListener('dragend', () => {
  if (!dragRow) return
  dragRow.classList.remove('drag')
  dragRow = null
  const curName = ENGINES[state.engine].n
  const next = qa('.eng-row.sortable').map(r => ENGINES[+r.getAttribute('data-idx')])
  ENGINES.length = 0
  next.forEach(x => ENGINES.push(x))
  state.engine = Math.max(0, ENGINES.findIndex(x => x.n === curName))
  renderEngine(); refreshDrawer(); toast('搜索引擎顺序已更新')
})
document.addEventListener('mouseover', e => {
  const b = e.target.closest && e.target.closest('.pill-btn')
  const tip = q('#modeTip')
  if (b) { const m = MODES.filter(x => x.k === b.getAttribute('data-v'))[0]
    tip.textContent = m ? m.d : ''
    tip.style.left = (b.getBoundingClientRect().left - q('#stage').getBoundingClientRect().left) / (q('#stage').getBoundingClientRect().width / STAGE_W) + 'px'
    tip.classList.add('show') }
})
let wheelT = 0
stage.addEventListener('wheel', e => {
  if (!e.target.closest('#pager')) return
  const now = Date.now()
  if (now - wheelT < 450) return
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY
  if (Math.abs(d) < 12) return
  wheelT = now
  goPage(state.cur[state.mode] + (d > 0 ? 1 : -1))
}, { passive: true })
let drag = null
stage.addEventListener('mousedown', e => {
  const el = e.target.closest && e.target.closest('.item')
  if (!el || e.button !== 0 || e.target.closest('.ia')) return
  const it = curPage().filter(x => x.id === el.getAttribute('data-id'))[0]
  if (!it) return
  const gr = el.parentElement.getBoundingClientRect()
  const s = gr.width / (COLS * CELL)
  drag = { it: it, el: el, lab: el.nextElementSibling, gr: gr, s: s,
    gx: (e.clientX - gr.left) / s - (it.c * CELL + INSET), gy: (e.clientY - gr.top) / s - (it.r * CELL + INSET), moved: false }
})
document.addEventListener('mousemove', e => {
  if (!drag) return
  const L = (e.clientX - drag.gr.left) / drag.s - drag.gx
  const T = (e.clientY - drag.gr.top) / drag.s - drag.gy
  if (!drag.moved && Math.abs(L - (drag.it.c * CELL + INSET)) < 4 && Math.abs(T - (drag.it.r * CELL + INSET)) < 4) return
  drag.moved = true
  drag.el.classList.add('dragging')
  drag.el.style.left = L + 'px'
  drag.el.style.top = T + 'px'
  drag.c = Math.max(0, Math.min(COLS - drag.it.w, Math.round((L - INSET) / CELL)))
  drag.r = Math.max(0, Math.min(ROWS - drag.it.h, Math.round((T - INSET) / CELL)))
  if (drag.lab && drag.lab.classList.contains('item-label')) {
    drag.lab.style.left = (drag.c * CELL) + 'px'
    drag.lab.style.top = ((drag.r + drag.it.h) * CELL - 24) + 'px'
  }
})
document.addEventListener('mouseup', () => {
  if (!drag) return
  const d = drag
  drag = null
  d.el.classList.remove('dragging')
  if (!d.moved) return
  const page = curPage()
  const clash = page.some(x => x !== d.it && x.c < d.c + d.it.w && d.c < x.c + x.w && x.r < d.r + d.it.h && d.r < x.r + x.h)
  if (clash) { toast('该位置已被占用'); renderPager(); return }
  d.it.c = d.c
  d.it.r = d.r
  renderPager()
})
window.addEventListener('resize', fit)

/* ===================== 15. 初始化 ===================== */
const boot = () => {
  applySkin(state.skinId, true)
  syncStage()
  renderPager()
  renderDock()
  renderPill()
  renderEngine()
  clockTick()
  setInterval(clockTick, 1000)
  fit()
  if (state.autoFocus) q('#searchInput').focus()
  if (!sessionStorage.getItem('thrilled-welcome')) {
    sessionStorage.setItem('thrilled-welcome', '1')
    openModal('theme')
  }
}
boot()
</script>
</body>
